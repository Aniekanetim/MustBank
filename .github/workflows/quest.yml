name: MustPayroll Quest verification
on:
  push:
    branches: [main, quest/rewards-settlement]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: QA/Quality Control/execute_test_cases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.21.0'
          cache: npm
          cache-dependency-path: |
            QA/Quality Control/execute_test_cases/package-lock.json
            MustBank/Mustpayroll_buggy/package-lock.json
            MustBank/MustPayroll_fixed/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ../../../MustBank/Mustpayroll_buggy
      - run: npm ci --prefix ../../../MustBank/MustPayroll_fixed
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mustpayroll-test-results
          path: |
            QA/Quality Control/test_cases/
            QA/Quality Control/execute_test_cases/results/
          retention-days: 14
